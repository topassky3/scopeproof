name: Django backend checks

on:
  push:
    branches:
      - main
      - feat/django-backend-foundation-20261110
      - feat/standalone-django-auth-20261111
    paths:
      - "backend/**"
      - ".github/workflows/django-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/django-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "github-ci-only-secret-not-for-production"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Django system checks
        run: python backend/manage.py check
      - name: Verify migrations match models
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python backend/manage.py test accounts reviews --verbosity 2
