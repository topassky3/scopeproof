modules:
  jira:projectPage:
    - key: scopeproof-project
      title: Scopeproof
      resource: frontend
      resolver:
        function: main-resolver
      layout: native
  jira:issuePanel:
    - key: scopeproof-issue
      title: Scopeproof Evidence
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: frontend
      resolver:
        function: main-resolver
  scheduledTrigger:
    - key: scopeproof-privacy-audit
      function: privacy-audit
      interval: fiveMinute
  function:
    - key: privacy-audit
      handler: privacy/forge-audit.handler
      timeoutSeconds: 300
    - key: main-resolver
      handler: index.handler
resources:
  - key: frontend
    path: dist
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
    - report:personal-data
app:
  id: ari:cloud:ecosystem::app/74c7ab33-fea7-4061-9ecc-1cd5a1b898dc
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  storage:
    entities:
      - name: scopeproof-review
        attributes:
          projectId:
            type: string
          issueKey:
            type: string
          revision:
            type: string
          token:
            type: string
          review:
            type: any
        indexes:
          - name: by-project-issue
            partition:
              - projectId
            range:
              - issueKey

      - name: scopeproof-privacy-job
        attributes:
          revision:
            type: string
          token:
            type: string
          payload:
            type: any
