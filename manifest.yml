modules:
  jira:projectPage:
    - key: scopeproof-project
      title: Scopeproof
      resource: frontend
      resolver:
        function: main-resolver
      layout: native
  jira:issuePanel:
    - key: scopeproof-issue
      title: Scopeproof Evidence
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: frontend
      resolver:
        function: main-resolver
  function:
    - key: main-resolver
      handler: index.handler
resources:
  - key: frontend
    path: dist
permissions:
  scopes:
    - read:jira-work
    - storage:app
app:
  id: ari:cloud:ecosystem::app/74c7ab33-fea7-4061-9ecc-1cd5a1b898dc
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
